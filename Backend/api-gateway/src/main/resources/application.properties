spring.application.name=api-gateway
server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=study-community-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://study-community-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/community/**